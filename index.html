<!DOCTYPE html>
<html>
	<head>
		<style>
			html,
			body {
				background: #222;
				height: 100%;
			}

			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}

			* {
				padding: 0;
				margin: 0;
				box-sizing: border-box;
			}
			#canvas {
				margin: 3px;
				display: block;
				width: 700px;
				height: 700px;
				margin-bottom: 0;
			}

			form {
				display: flex;
				align-items: center;

				color: white;
				padding: 5px;

				user-select: none;
			}

			div#ads {
				margin: 3px;
			}

			[hidden] {
				display: none !important;
			}

			#header-row {
				display: flex;
				gap: 20px;
				align-items: center;
				color: white;
				font-family: Arial, sans-serif;
				font-size: 14px;
				margin-bottom: 6px;
			}

			#header-row select {
				font-family: inherit;
				font-size: inherit;
			}
		</style>
		<title>Snake</title>
	</head>
	<body>
		<div id="header-row">
			<label for="difficulty-select">Difficulty:
				<select id="difficulty-select">
					<option value="easy">Easy</option>
					<option value="medium" selected>Medium</option>
					<option value="hard">Hard</option>
				</select>
			</label>
			<span>Current: <span id="header-difficulty">medium</span></span>
			<span>Score: <span id="header-score">0</span></span>
			<span>Best: <span id="header-best">0</span></span>
		</div>
		<canvas id="canvas" width="1310" height="1310"></canvas>

		<script src="app.js"></script>

		<div id="ads"></div>
	</body>
</html>
