<!DOCTYPE html>
<html>
	<head>
		<style>
			html,
			body {
				background: #222;
				height: 100%;
			}

			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: flex-start;
				overflow-y: auto;
			}

			* {
				padding: 0;
				margin: 0;
				box-sizing: border-box;
			}
			#canvas {
				margin: 3px;
				display: block;
				width: 750px;
				height: 750px;
				margin-bottom: 0;
			}

			form {
				display: flex;
				align-items: center;

				color: white;
				padding: 5px;

				user-select: none;
			}

			div#ads {
				margin: 3px;
			}

			[hidden] {
				display: none !important;
			}

			#header-row {
				display: flex;
				align-items: center;
				gap: 10px;
				width: 750px;
				box-sizing: border-box;
				padding: 10px 16px;
				margin-bottom: 8px;
				background: #2c2c2c;
				border: 1px solid #3a3a3a;
				border-radius: 10px;
				color: #eee;
				font-family: 'Segoe UI', Arial, sans-serif;
				font-size: 14px;
			}

			#header-row .diff-group {
				display: flex;
				align-items: center;
				gap: 8px;
				margin-right: auto;
			}

			#header-row .diff-group label {
				color: #aaa;
				font-weight: 600;
				letter-spacing: .03em;
				text-transform: uppercase;
				font-size: 11px;
			}

			#difficulty-select {
				font-family: inherit;
				font-size: 13px;
				color: #eee;
				background: #1e1e1e;
				border: 1px solid #4a4a4a;
				border-radius: 6px;
				padding: 4px 8px;
				cursor: pointer;
			}

			#difficulty-select:hover {
				border-color: #777;
			}

			.stat-pill {
				display: flex;
				align-items: baseline;
				gap: 6px;
				background: #1e1e1e;
				border: 1px solid #3a3a3a;
				border-radius: 6px;
				padding: 4px 10px;
			}

			.stat-pill .stat-label {
				color: #999;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: .03em;
				font-weight: 600;
			}

			.stat-pill .stat-value {
				font-weight: 700;
				font-size: 15px;
			}

			#header-difficulty {
				color: #7fdc7f;
				text-transform: capitalize;
			}

			#header-score {
				color: #fff;
			}

			#header-best {
				color: #ffd166;
			}

			.header-btn {
				font-family: inherit;
				font-size: 13px;
				font-weight: 600;
				color: #eee;
				background: #1e1e1e;
				border: 1px solid #4a4a4a;
				border-radius: 6px;
				padding: 6px 12px;
				cursor: pointer;
			}

			.header-btn:hover {
				border-color: #777;
				background: #262626;
			}

			.header-btn:active {
				background: #171717;
			}

			#pause-btn.is-paused {
				border-color: #ffd166;
				color: #ffd166;
			}
		</style>
		<title>Snake</title>
	</head>
	<body>
		<div id="header-row">
			<div class="diff-group">
				<label for="difficulty-select">Difficulty</label>
				<select id="difficulty-select">
					<option value="easy">Easy</option>
					<option value="medium" selected>Medium</option>
					<option value="hard">Hard</option>
				</select>
			</div>
			<div class="stat-pill">
				<span class="stat-label">Mode</span>
				<span class="stat-value" id="header-difficulty">medium</span>
			</div>
			<div class="stat-pill">
				<span class="stat-label">Score</span>
				<span class="stat-value" id="header-score">0</span>
			</div>
			<div class="stat-pill">
				<span class="stat-label">Best</span>
				<span class="stat-value" id="header-best">0</span>
			</div>
			<button type="button" id="pause-btn" class="header-btn">Pause</button>
			<button type="button" id="restart-btn" class="header-btn">Restart</button>
		</div>
		<canvas id="canvas" width="750" height="750"></canvas>

		<script src="app.js"></script>

		<div id="ads"></div>
	</body>
</html>
